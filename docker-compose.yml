
# ══════════════════════════════════════════════════════════════════════
#  DTS Chatbot — Docker Compose
#
#  Services managed by Docker:
#    admin             :3005  — Next.js admin panel
#    embedding_service :8002  — Sentence-transformer microservice (Phase 3)
#    ai_engine         :8000  — FastAPI chatbot engine (4 Uvicorn workers)
#    llm               :8001  — Shared LLM gateway → Ollama (external LAN)
#    chromadb          :8100  — ChromaDB vector database for RAG
#    db                :3308  — MySQL 8
#
#  Services already running on UBUNTU SERVER 192.168.160.118 (not containerised):
#    ✅ Nginx   — routes traffic externally (proxy_pass to ports below)
#    ✅ Redis   — accessed at 192.168.160.118:6379
#    ✅ Ollama  — running at 192.168.160.118:11434
#
#  One command to start everything:
#    docker compose up --build -d
#    run project: docker compose up -d
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Admin Panel (Next.js) ─────────────────────────────────────────
  admin:
    build:
      context: ./adminDB
      dockerfile: Dockerfile
    container_name: dts_admin
    restart: unless-stopped
    ports:
      # Nginx on your local server should proxy_pass to this port
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=dts_user
      - DB_PASSWORD=dts_pass
      - DB_NAME=documenttracker
      - AI_ENGINE_URL=http://ai_engine:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploaded documents across container rebuilds
      - ./adminDB/public/uploads:/app/public/uploads
    networks:
      - dts_net

  # ── Embedding Microservice (Phase 3) ─────────────────────────────
  # One instance loads sentence-transformers (~600 MB). All 4 AI-Engine
  # workers call it via HTTP instead of each loading the model locally
  # (saves ~1.8 GB RAM at scale).
  embedding_service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: dts_embedding
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - HOST=0.0.0.0
      - PORT=8002
    volumes:
      # Cache model files so rebuilds don't re-download
      - embedding_model_cache:/root/.cache/huggingface
    networks:
      - dts_net

  # ── AI Engine (FastAPI — 4 Uvicorn workers) ───────────────────────
  # Phase 3: --workers 4 allows 4 concurrent requests without async
  # context-switching (CPU-bound routes benefit most).
  # EMBEDDING_SERVICE_URL points workers at the shared embedding service
  # instead of loading sentence-transformers individually.
  ai_engine:
    build:
      context: ./AI-Engine
      dockerfile: Dockerfile
    container_name: dts_ai_engine
    restart: unless-stopped
    # Phase 3: 4 Uvicorn workers instead of 1
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--log-level", "info"]
    ports:
      # Nginx on your local server should proxy_pass to this port
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://dts_user:dts_pass@db:3306/documenttracker
      - DTS_API_BASE_URL=http://admin:3005
      - DTS_MOCK_MODE=false
      - CORS_ORIGINS=http://localhost,http://localhost:3005,http://127.0.0.1:3005,http://192.168.160.118,http://192.168.160.118:3005,http://192.168.160.118:8000
      - HOST=0.0.0.0
      - PORT=8000
      - USE_LLM=true
      - LLM_SERVICE_URL=http://llm:8001
      - USE_RAG=true
      - RAG_DOCUMENT_API_URL=http://admin:3005/api/general-documents
      - LOCATIONS_API_URL=http://admin:3005/api/locations
      - CONFIDENCE_THRESHOLD=0.4
      - RAG_TOP_K=3
      # ChromaDB vector database connection
      # NOTE: Inside Docker network, use the container's INTERNAL port (8000),
      # not the host-mapped port (8100). Port 8100 only works from the host.
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # Phase 3: shared embedding microservice — workers call this instead
      # of loading sentence-transformers locally (saves ~1.8 GB RAM)
      - EMBEDDING_SERVICE_URL=http://embedding_service:8002
      # Redis
      - REDIS_URL=redis://192.168.160.118:6379/0
      - RAG_CACHE_ENABLED=true
      - FAQ_API_URL=http://admin:3005/api/faq
    volumes:
      # Persist trained ML models between restarts
      - ai_ml_models:/app/ml_models
      - ai_ml_data:/app/ml_data
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
      chromadb:
        condition: service_started
      embedding_service:
        condition: service_started
    networks:
      - dts_net

  # ── Pipeline Automator (LangChain File Ingestion) ────────────────
  automator:
    build:
      context: ./AI-Engine
      dockerfile: Dockerfile
    container_name: dts_automator
    restart: unless-stopped
    command: ["python", "scripts/automator.py"]
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - UPLOAD_DIR=/app/uploads
      - OMP_NUM_THREADS=1 # Good for background huggingface embedding
    volumes:
      # We map a local folder to /app/uploads so that when you drag files
      # into the host folder, the container automatically processes them.
      - ./uploads:/app/uploads
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - dts_net
  # ── LLM Gateway (FastAPI → Ollama) ───────────────────────────────
  llm:
    build:
      context: ./LLM
      dockerfile: Dockerfile
    container_name: dts_llm
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Ollama — running on the Docker host.
      # Use host.docker.internal so this works on a partner machine whose LAN IP
      # is not 192.168.160.118.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:9b
      - OLLAMA_TIMEOUT=90
      # Redis — running on the Docker host
      - REDIS_URL=redis://host.docker.internal:6379/0
      - CACHE_TTL=3600
      - CACHE_ENABLED=true
      - HOST=0.0.0.0
      - PORT=8001
    extra_hosts:
      # Linux Docker support for host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - dts_net

  # ── ChromaDB Vector Database ─────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: dts_chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - dts_net

  # ── MySQL 8 Database ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: dts_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: documenttracker
      MYSQL_USER: dts_user
      MYSQL_PASSWORD: dts_pass
    ports:
      # Ports 3306 & 3307 used by WAMP — using 3308 on the host
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Auto-run schema files on first boot
      - ./adminDB/schema.sql:/docker-entrypoint-initdb.d/01_admin_schema.sql:ro
      - ./AI-Engine/schema.sql:/docker-entrypoint-initdb.d/02_ai_engine_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dts_user", "-pdts_pass"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - dts_net

# ── Named Volumes ──────────────────────────────────────────────────
volumes:
  db_data:
  ai_ml_models:
  ai_ml_data:
  chroma_data:
  embedding_model_cache:   # persists huggingface model weights between rebuilds

# ── Internal Network ───────────────────────────────────────────────
networks:
  dts_net:
    driver: bridge
